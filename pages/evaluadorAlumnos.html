<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../Styles/evaluadorAlumnos.css">
        <script src="../js/evaluadorAlumnos.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Evaluador de alumnos</h1>
        <p>Fundamentos de JS</p>
        <section class="card">
            <h2>Evaluar calificacion</h2>
            <label for="nombre">Nombre</label>
            <input id = "nombre" type="text" placeholder="Ingresa el nombre del alumno">
            <label for="calificacion">Calificación</label>  
            <input id = "calificación" type="number" min = "0" max = "10" step="0.1" placeholder="Ingresa tu calificación">
            <button id = "evaluar">Evaluar</button>
            <p id = "resultado"></p>
        </section> 
    </main>
</body>
</html>
