<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="../Styles/styles.css">
    <script src="../js/home.js" defer></script>
</head>

<body>
    <main class="contenedor">
        <h1>Home</h1>

        <section class="panel">
            <h2>Resultado</h2>
            <p id="mensaje" aria-live="polite"></p>
            <div id="sesion"></div>
            <button id="cerrarSesion" type="button">Cerrar sesión</button>
        </section>
        <section class="panel" id="panelMateriales">
            <div class = "encabezado-Materiales">
                <h2>Materiales registrados</h2>
                <p>Datos obtenidos por API-Proyecto_Materiales</p>
            </div>

            <div class="acciones-Materiales">
                <button id="cargarDatos">Actualizar</button>
                <button id="registrarMateriales">Registro de material</button>
            </div>

            <p id="estadoDatos">
                Cargando datos...
            </p>

            <div id="contenedorDatos"> </div>
        </section>
    </main>
</body>

</html>
